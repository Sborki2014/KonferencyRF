<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Линый Кабинет - Конференции.РФ</title>
</head>
<body>
    <h1>Мои заявки</h1>

    <article>
        <h2>Заявка №1</h2>
        <p>Помещение: Кинозал "Премьера"</p>
        <p>Дата начала конференции: 15.11.2026</p>
        <p>Способ оплаты: Перевод по СБП</p>
        <p>Статус: <span class="status">Новая</span></p>
    </article>

    <article>
        <h2>Заявка №2</h2>
        <p>Помещение: Конференц-зал «Атриум»</p>
        <p>Дата начала конференции: 01.11.2026</p>
        <p>Способ оплаты: При очном посещении</p>
        <p>Статус: <span class="status">Завершено</span></p>
    </article>

    <form action="" method="post">
        <label for="review">Ваш отзыв:</label>
        <textarea id="review" name="review" rows="4" cols="40" placeholder="Поделитесь Вашими впечатлениями о мероприятии" required></textarea>

        <button type="submit">Оставить отзыв</button>
    </form>
</body>
</html>
