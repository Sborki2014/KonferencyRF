<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Конференции.РФ</title>
    <link rel="stylesheet" href="css/stylesheet">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <a class="header__logo" href="/">Конференции.РФ</a>
        <nav class="nav">
            <a class="nav__link" href="login.html">Вход</a>
            <a class="nav__link" href="register.html">Регистрация</a>
        </nav>
    </header>
    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main">
        <section class="form-box">
            <h1>Вход в систему</h1>

            <!--ФОРМА ВХОДА-->
            <div class="message"></div>
            <form method="post" action="/login.html">
                <label for="login">Логин</label>
                <input id="login" name="login" type="text">

                <label for="password">Пароль</label>
                <input id="password" name="password" type="password">

                <button type="submit">Войти</button>
            </form>
            <p>Ещё не зарегистрированы? <a href="/register">Регистрация</a></p>
        </section>
    </main>
    <!--ПОДВАЛ-->
    <footer class="footer">
        <p>© 2027 Конференции.РФ</p>
    </footer>
</body>
</html>
