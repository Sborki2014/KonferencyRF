<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Конференции.РФ</title>
    <link rel="stylesheet" href="/static//node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <div class="header__inner container">
            <a class="header__logo" href="/templates/index.html">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="/templates/login.html">Вход</a>
                <a class="nav__link" href="/templates/register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    
    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main">
        <section class="form-box">
            <h1>Вход в систему</h1>

            <!--ФОРМА ВХОДА-->
            <div class="message"></div>
            <form id="loginForm" method="post" action="/templates//login.html" novalidate>
                
                <label class="form-label" for="login">Логин</label>
                <input class="form-control" id="login" name="login" type="text" class="form-control">
                <div class="form__error"></div>

                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password">
                <div class="form__error"></div>


                <button class="btn btn-primary" type="submit">Войти</button>
            </form>
            <p>Ещё не зарегистрированы? <a href="/templates//register.html">Регистрация</a></p>
        </section>
    </main>
    <!--ПОДВАЛ-->
    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2027 Конференции.РФ</p>
        </div>
    </footer>
    <script type="module" src="/static//node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/validation.js"></script>
</body>
</html>
