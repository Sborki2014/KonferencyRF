<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование помещения - Конференции.РФ</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <div class="header__inner container">
            <a class="header__logo" href="/templates/index.html">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="/templates/login.html">Вход</a>
                <a class="nav__link" href="/templates/register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main container my-4">
        <h1 class="mb-4">Бронирование помещения</h1>

        <form action="" method="post">
            <div class="mb-3">
                <label class="form-label" for="room_name">Помещения:</label>
                <input class="form-control" type="text" id="room_name" name="room_name" placeholder="Кинозал 'Премьер'" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="start_date">Дата начала конференции:</label>
                <input class="form-control" type="text" id="start_date" name="start_date" placeholder="ДД.ММ.ГГГГ" required>
            </div>

            <div class="mb-3">
                <p class="form-label">Способ оплаты:</p>
                
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="pay1" name="payment_method" value="При очном посещении" required>
                    <label class="form-check-label" for="pay1">При очном посещении</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" id="pay2" name="payment_method" value="Перевод по СБП">
                    <label class="form-check-label" for="pay2">Перевод по СБП</label>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Отправить</button>
        </form>
    </main>

    <!--ПОДВАЛ-->
    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2027 Конференции.РФ</p>
        </div>
    </footer>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
