<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование помещения - Конференции.РФ</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <div class="header__inner">
            <a class="header__logo" href="index.html">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="login.html">Вход</a>
                <a class="nav__link" href="register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    
    <form action="" method="post">
        <label class="form-label" for="room_name">Помещения:</label>
        <input class="form-control" type="text" id="room_name" name="room_name" placeholder="Кинозал 'Премьер' required">


        <label class="form-label" for="start_date">Дата начала конференции:</label><br>
        <input class="form-control" type="text" id="start_date" name="start_date" placeholder="ДД.ММ.ГГГГ" required>


        <p>Способ оплаты:</p>
        <input class="form-control" type="radio" id="pay1" name="payment_method" value="При очном посещении">
        <label class="form-label" for="pay1">При очном посещении</label>

        <input class="form-control" type="radio" id="pay2" name="payment_method" value="Перевод по СБП">
        <label class="form-label" for="pay2">Перевод по СБП</label>

        <button class="btn btn-primary" type="submit">Отправить</button>
    </form>

    <!--ПОДВАЛ-->
    <footer class="footer">
        <p>© 2027 Конференции.РФ</p>
    </footer>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
