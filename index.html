<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Конференции.РФ</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <div class="header__inner container">
            <a class="header__logo" href="index.html">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="login.html">Вход</a>
                <a class="nav__link" href="register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    
    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main">
        <section class="form-box">
            <h1>Вход в систему</h1>

            <!-- Слайдер Bootstrap с автопрокруткой !-->
            <div id="roomsSlider" class="carousel slide slider" data-bs-ride="carousel" data-bs-interval="5000">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="slider__img d-block w-100" src="img/IMG_1.jpg" alt="Аудитория">
                        <div class="carousel-caption"><h2>Аудитории</h2></div>
                    </div>
                    <div class="carousel-item">
                        <img class="slider__img d-block w-100" src="img/IMG_2.jpg" alt="Коворкинг">
                        <div class="carousel-caption"><h2>Коворкинг</h2></div>
                    </div>
                    <div class="carousel-item">
                        <img class="slider__img d-block w-100" src="img/IMG_3.jpg" alt="Кинозал">
                        <div class="carousel-caption"><h2>Кинозал</h2></div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#roomsSlider" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Предыдущий</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#roomsSlider" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Следующий</span>
                </button>
            </div>

            <button id="helloButton" class="btn btn-primary button">Add Cat</button>
            <p id="catText">Cats: <span id="counter">0</span></p>.
        </section>
    </main>
    <!--ПОДВАЛ-->
    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2027 Конференции.РФ</p>
        </div>
    </footer>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
