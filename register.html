<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Конференции.РФ</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <div class="header__inner container">
            <a class="header__logo" href="index.html">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="login.html">Вход</a>
                <a class="nav__link" href="register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    
    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main">
        <section class="form-box">
            <h1>Регистрация</h1>

            <!--ФОРМА РЕГИСТРАЦИИ-->
            <div class="message"></div>
            <form method="post" action="/register"> 
                <label class="form-label" for="login">Придумайте логин</label>
                <input class="form-control" id="login" name="login" type="text" placeholder="ivanov2027" required>
                <div class="form__error"></div>

                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.ru" required>
                <div class="form__error"></div>

                <label class="form-label" for="password">Придумайте пароль</label>
                <input class="form-control" id="password" name="password" type="password" placeholder="Пароль" required>
                <div class="form__error"></div>

                <label class="form-label" for="fullname">Ваше ФИО</label>
                <input class="form-control" id="fullname" name="fullname" type="text" placeholder="Иванов Иван Иванович" required>
                <div class="form__error"></div>

                <label class="form-label" for="phone">Ваш номер телефона</label>
                <input class="form-control" id="phone" name="phone" type="tel" placeholder="8(900)123-45-67" required>
                <div class="form__error"></div>

                <button class="btn btn-primary" type="submit">Создать пользователя</button>
            </form>
            <p>Уже зарегистрированы? <a href="login.html">Войти</a></p>
        </section>
    </main>
    <!--ПОДВАЛ-->
    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2027 Конференции.РФ</p>
        </div>
    </footer>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/validator.js"></script>
</body>
</html>
