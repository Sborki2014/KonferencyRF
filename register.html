<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Конференции.РФ</title>
    <link rel="stylesheet" href="css/stylesheet">
</head>
<body>
    <!--ШАПКА-->
    <header class="header">
        <a class="header__logo" href="/">Конференции.РФ</a>
        <nav class="nav">
            <a class="nav__link" href="login.html">Вход</a>
            <a class="nav__link" href="register.html">Регистрация</a>
        </nav>
    </header>
    <!--ОСНОВНОЕ СОДЕРЖИМОЕ-->
    <main class="main">
        <section class="form-box">
            <h1>Регистрация</h1>

            <!--ФОРМА РЕГИСТРАЦИИ-->
            <div class="message"></div>
            <form method="post" action="/register"> 
                <label for="login">Придумайте логин</label>
                <input id="login" name="login" type="text" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required>

                <label for="password">Придумайте пароль</label>
                <input id="password" name="password" type="password" required>

                <label for="fullname">Ваше ФИО</label>
                <input id="fullname" name="fullname" type="text" required>

                <label for="phone">Ваш номер телефона</label>
                <input id="phone" name="phone" type="tel" required>

                <button type="submit">Зарегистрироваться</button>
            </form>
            <p>Уже зарегистрированы? <a href="login.html">Войти</a></p>
        </section>
    </main>
    <!--ПОДВАЛ-->
    <footer class="footer">
        <p>© 2027 Конференции.РФ</p>
    </footer>
</body>
</html>
